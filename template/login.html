{% extends "base.html" %}

{% block title %}Sign In - Temple Management System{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-5 col-sm-8">
            <div class="temple-card p-4">
                <div class="text-center mb-3">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" style="height: 42px;" class="mb-2">
                    <h3 class="fw-bold mb-1">Devotee Sign In</h3>
                    <p class="text-muted small">Sign in to view your bookings and passes</p>
                </div>

                <form method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility()">
                                <i class="fas fa-eye" id="togglePasswordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">
                        Sign In
                    </button>
                </form>

                <div class="text-center mt-3 pt-2 border-top">
                    <small class="text-muted">
                        Don't have an account? <a href="/signup{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" class="fw-bold">Sign Up</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function togglePasswordVisibility() {
        var pwd = document.getElementById("password");
        var icon = document.getElementById("togglePasswordIcon");
        if (pwd.type === "password") {
            pwd.type = "text";
            icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            pwd.type = "password";
            icon.classList.replace("fa-eye-slash", "fa-eye");
        }
    }
</script>
{% endblock %}
